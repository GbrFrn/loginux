# Logitech G316 X 98, ANSI 98-key layout. The format is described in CONTRIBUTING.md.
#
# Zone IDs are the keyboard's 0x8081 zones (HID keyboard usage minus 3,
# modifiers 104-111), read live from the keyboard and checked against its
# firmware. Positions are in key units (1 = one key pitch), measured from G
# HUB's layout data and snapped to quarter units. Positions are layout data,
# not proof of which LED lights: run a channel check to confirm them.

name = "Logitech G316 X 98"
protocol = "hidpp20"
vendor = 0x046d
product = 0xc36b
interface = 2
board = [19.5, 6.625]

# Zones the keyboard accepts with no known key. loginux lights them only when a
# profile names them under [zones].
unknown = [0, 47, 99, 100, 101, 102, 103, 154]

# `short` is drawn when the label does not fit the key at the current scale.
keys = [
  { name = "esc", zone = 38, at = [0, 0] },
  { name = "f1", zone = 55, at = [1.25, 0] },
  { name = "f2", zone = 56, at = [2.25, 0] },
  { name = "f3", zone = 57, at = [3.25, 0] },
  { name = "f4", zone = 58, at = [4.25, 0] },
