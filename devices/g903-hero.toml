# Logitech G903 LIGHTSPEED with HERO sensor, on its cable. The format is
# described in CONTRIBUTING.md and the evidence in research/g903.md.
#
# The mouse has no per-key lighting: it reports two 0x8071 clusters, and the
# light below is cluster 1, the G logo, painted with the Static effect in RAM.
# Cluster 0 is the DPI indicator, the three LEDs under the DPI buttons. Its
# firmware decides which of those LEDs are on, and a host cannot light them,
# so this definition leaves it out. Claiming the lighting still takes every
# cluster: the DPI indicator stays dark while Loginux holds the lighting
# (live, 2026-10-22). The rectangle only sketches the logo's place.

name = "Logitech G903 HERO"
protocol = "hidpp20"
lighting = "clusters"
vendor = 0x046d
product = 0xc091
interface = 2
board = [4, 6]

lights = [
  { name = "logo", zone = 1, at = [1.25, 3], size = [1.5, 1.5] },
]
