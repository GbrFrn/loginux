[package]
name = "loginux"
version = "0.1.8"
edition = "2024"
description = "RGB lighting for Logitech HID++ keyboards and mice on Linux"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "glow", "wayland", "x11"] }
ksni = { version = "0.3.6", features = ["blocking"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# preserve_order: Claude Code's settings.json keeps its key order when Loginux edits it
# (indexmap is already built for eframe).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"

[features]
# Development aid for checking the window's rendering: see `shot` in src/ui.rs.
screenshot = []

[profile.release]
strip = true
