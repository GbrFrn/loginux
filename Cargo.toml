[package]
name = "loginux"
version = "0.1.0"
edition = "2024"
description = "Per-key RGB for Logitech HID++ devices on Linux"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "glow", "wayland", "x11"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[features]
# Development aid for checking the window's rendering: see `shot` in src/ui.rs.
screenshot = []

[profile.release]
strip = true
